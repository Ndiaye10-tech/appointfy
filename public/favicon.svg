<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="50%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF1F2"/>
    </linearGradient>

    <!-- Luxury Gold Accent -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#881337" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle Inner Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#FDA4AF" stroke-width="6" opacity="0.4"/>

  <!-- Center Luxury Emblem Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Shield / Petal Security Contour -->
    <path
      d="M256 96C256 96 368 136 368 236C368 326 276 394 256 414C236 394 144 326 144 236C144 136 256 96 256 96Z"
      fill="url(#shieldGrad)"
    />

    <!-- Dynamic Checkmark Loop in Pink/Rose -->
    <path
      d="M196 240L236 280L320 196"
      stroke="#DB2777"
      stroke-width="32"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Sparkling Gold Luxury Jewel Accent -->
    <circle cx="256" cy="148" r="18" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="4"/>
  </g>
</svg>